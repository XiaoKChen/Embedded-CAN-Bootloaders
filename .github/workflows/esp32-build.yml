# =============================================================================
# esp32-build.yml — Host tests + ESP32-S3 node updater and brain builds;
#                   universal provisioning bundle; release on c-cpp-esp32-v*
# =============================================================================
# The firmware is built with ./build.sh, the same one-command script users
# run, so CI and local builds share the ESP-IDF pin in idf-version.txt. Each
# board gets its own artifact and release zip: esp32s3-node-updater (the
# node's CAN updater) and esp32s3-brain (the brain's Ethernet OTA firmware).
# Release tags follow <lang>-<target>-v* across branches (c-cpp-ra4m1-v*,
# embassy-ra4m1-v*): this one is c-cpp-esp32-v*, and the release/artifact
# version is the tag minus that prefix (c-cpp-esp32-v1.0.0 -> v1.0.0).
# The common updater bundle is assembled by the build script, with a manifest
# and both board tables; CI fetches esp_tinyusb using the managed-component pin.
# =============================================================================

name: esp32-build

on:
  push:
    branches: [version/c-cpp/esp32]
    tags: ['c-cpp-esp32-v*']
  pull_request:
    branches: [version/c-cpp/esp32]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Snapshot bundle versions use the nearest ESP32 release tag.

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'

      - name: Host tests (pure-logic core)
        run: |
          cmake -S tests -B build-host
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure

      - name: Cache ESP-IDF and its tools
        uses: actions/cache@v4
        with:
          path: .tools
          # The cached virtualenv is bound to this exact interpreter.
          key: esp-idf-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('idf-version.txt') }}

      # No argument: node_updater, then brain.
      - name: Build firmware (node updater + brain)
        run: ./build.sh

      # The examples share the pinned ESP-IDF; building them keeps the shared
      # components (can_link, can_updater_client, node_reset) honest.
      - name: Build examples
        run: |
          ./build.sh examples/bench_app
          ./build.sh examples/slcan_bridge

      - name: Stage binaries
        run: |
          stage() {  # <project dir> <app .bin> <dist dir>
            mkdir -p "$3"
            (cd "$1/build" && cp --parents bootloader/bootloader.bin \
               partition_table/partition-table.bin ota_data_initial.bin "$2" \
               flash_args flasher_args.json "$OLDPWD/$3/")
          }
          stage node_updater can_updater.bin dist/node
          stage brain brain_ota.bin dist/brain

      - uses: actions/upload-artifact@v4
        with:
          name: esp32s3-node-updater
          path: dist/node/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: esp32s3-can-updater
          path: node_updater/build/esp32s3-can-updater-*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: esp32s3-brain
          path: dist/brain/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/c-cpp-esp32-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: esp32s3-node-updater
          path: dist/node

      - uses: actions/download-artifact@v4
        with:
          name: esp32s3-brain
          path: dist/brain

      - uses: actions/download-artifact@v4
        with:
          name: esp32s3-can-updater
          path: dist/universal

      # One zip per board, each with its own bootloader, partition table,
      # otadata and flash_args. The loose assets are the two app images (OTA
      # over CAN for the node, over HTTP for the brain); the other files
      # share names between the boards, so they ship only in the zips.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#c-cpp-esp32-}"   # c-cpp-esp32-v1.0.0 -> v1.0.0
          (cd dist/node && zip -r "../../esp32s3-node-updater-${version}.zip" .)
          (cd dist/brain && zip -r "../../esp32s3-brain-${version}.zip" .)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "ESP32-S3 node updater + brain ${version}" --generate-notes \
            "esp32s3-node-updater-${version}.zip" "esp32s3-brain-${version}.zip" \
            dist/universal/esp32s3-can-updater-*.zip \
            dist/node/can_updater.bin dist/brain/brain_ota.bin
