# =============================================================================
# Cargo.toml — bootloader
# =============================================================================
# The CAN-update bootloader binary (docs/plan.md §3). U0.2 (board bring-up,
# OFS, VBTBKR) and U0.3 (executor + time-driver skeleton) both touch this
# manifest — U0.1 seeds only what U0.2 needs (PAC + runtime + logging); U0.3
# adds embassy-executor/embassy-time/embassy-sync/embassy-futures plus a
# deliberately-sized `task-arena-size-*` feature when it wires the real
# executor (docs/plan.md §6).
# =============================================================================

[package]
name = "bootloader"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# Default build is the LEAN/shipped flavor: no defmt anywhere in the graph, so
# the binary links without a defmt global logger and drops the RTT/logging
# footprint (size gate ≤ 32 KiB). `--features defmt` restores the debug flavor:
# it re-enables defmt in this crate, `boot-logic`, `ra4m1-embassy`, and every
# embassy dep that exposes a defmt feature. Adding a defmt-capable dep? Add its
# `<dep>/defmt` here too, or the lean build wins by omission but the debug build
# silently loses that dep's logs.
default = []
defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "dep:panic-probe",
    "ra4m1-embassy/defmt",
    "boot-logic/defmt",
    "embassy-executor/defmt",
    "embassy-time/defmt",
    "embassy-usb/defmt",
    "embassy-usb-driver/defmt",
    "embassy-sync/defmt",
]

[dependencies]
boot-logic = { path = "../crates/boot-logic", default-features = false }
# Relocated to the Normal-Embedded-Embassy repo (interim path dep; switches to a
# git-pinned dep once that repo is pushed — CI needs git, see workspace Cargo.toml).
# `default-features = false` keeps defmt out of the lean graph; `ra4m1-embassy/defmt`
# in the `defmt` feature above pulls it back for the debug flavor.
ra4m1-embassy = { version = "1.0.0", registry = "gitea", default-features = false }
ra4m1 = { workspace = true }

# U0.3 (spike S2): thread-mode executor only — no interrupt executor; nothing
# in this bootloader has a hard latency requirement (docs/plan.md §4).
# The time-driver tick rate (3 MHz) is fixed by ra4m1-embassy's
# `embassy-time-driver/tick-hz-3_000_000` feature — see that crate's manifest
# and time_driver.rs for the wrap story.
# defmt on these is opt-in via this crate's `defmt` feature, not hardcoded here.
embassy-executor = { workspace = true, features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { workspace = true }

# Pre-added by the dispatcher for U1.1/U1.2 (both units share this manifest, so
# neither may edit it): frame types for can0.rs, NorFlash traits for flash_lp.rs.
embedded-can = { workspace = true }
embedded-storage = { workspace = true }

# Pre-added by the dispatcher for U2.1/U2.2 (same shared-manifest rule; not in
# the frozen workspace root, so plain version reqs per its header note):
# embassy-usb-driver traits for drivers/usbfs.rs, embassy-usb device/class
# plumbing for tasks/usb_dfu.rs. U2.3 owns any later edits (task arena size).
embassy-usb-driver = { version = "0.2" }
embassy-usb = { version = "0.6" }

# U2.3: the one shared flash mutex (docs/plan.md §4). embassy-sync 0.8 is
# already pinned in the frozen workspace root, so inherit that pin rather than
# duplicate a version here (the manifest's own rule: `workspace = true` for
# anything centralized). `NoopRawMutex` only — a single thread-mode executor,
# no ISR touches the flash driver.
embassy-sync = { workspace = true }

cortex-m = { workspace = true, features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = { workspace = true }
# Logging deps are optional: present only in the debug flavor. The lean build
# supplies its own reset-on-panic handler in main.rs (no panic-probe).
defmt = { workspace = true, optional = true }
defmt-rtt = { workspace = true, optional = true }
panic-probe = { workspace = true, features = ["print-defmt"], optional = true }
static_cell = { workspace = true }

[[bin]]
name = "bootloader"
test = false
bench = false
