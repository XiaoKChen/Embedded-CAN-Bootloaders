# =============================================================================
# Cargo.toml — demo-app
# =============================================================================
# Demo app linked at 0x8000 (docs/plan.md §1.2 consequence: stock Arduino
# IDE sketches relink here too): USB-CDC serial (virtual COM port) + defmt
# version-banner heartbeat + LED double-blink. No boot-to-bootloader trigger
# pin — re-entry is the bootloader-side double-tap reset (U1.6, docs/plan.md §6).
# =============================================================================

[package]
name = "demo-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
ra4m1-embassy = { path = "../crates/ra4m1-embassy", features = ["usb"] }
ra4m1 = { workspace = true }

# U1.6: thread-mode executor + embassy-time, mirroring bootloader/Cargo.toml
# (docs/plan.md §2). The time-driver tick rate (3 MHz) is fixed by
# ra4m1-embassy's `embassy-time-driver/tick-hz-3_000_000` feature.
embassy-executor = { workspace = true, features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { workspace = true, features = ["defmt"] }
embassy-futures = { workspace = true }

# USB-CDC serial demo. The RA4M1 USBFS driver lives in ra4m1-embassy (`usb`
# feature); here we only need the embassy-usb device stack + CDC-ACM class.
embassy-usb = { version = "0.6", features = ["defmt"] }
heapless = { workspace = true }

cortex-m = { workspace = true, features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = { workspace = true }
defmt = { workspace = true }
defmt-rtt = { workspace = true }
panic-probe = { workspace = true, features = ["print-defmt"] }
static_cell = { workspace = true }

[[bin]]
name = "demo-app"
test = false
bench = false
