name: CI

on:
  push:
    # Variant-prefixed: other branches of this repo ship other bootloaders,
    # so tags must not collide. v0.1.0-alpha.1 predates this (plain v* tag).
    tags: ["embassy-ra4m1-v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # docs/plan.md §1: bootloader `.bin` hard size gate.
  SIZE_GATE_BYTES: 32768
  # docs/plan.md §1.5 / bootloader/src/ofs.rs: OFS0/OFS1/Security-MPU words,
  # byte-identical to the stock Arduino bootloader dump at flash 0x400..0x43F.
  EXPECTED_OFS_HEX: >-
    ffffffffdfceffff
    fcffff00ffffff00
    fcffff00ffffff00
    fcffff00ffffff00
    fcff0f20ffff0f20
    fcff7f40ffff7f40
    fcff0d40ffff0d40
    ffffffffffffffff

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (+ thumbv7em-none-eabihf)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # boot-logic is host-only logic; everything else targets the chip.
      # Clippy needs both target graphs walked, since cargo won't otherwise
      # build cross-target members it can't run.
      # No --all-targets on the firmware graph: it would build each crate's
      # test harness, and libtest does not exist for thumbv7em-none-eabihf.
      - name: Clippy (firmware members, target triple)
        run: cargo clippy --workspace --exclude boot-logic --target thumbv7em-none-eabihf -- -D warnings
      - name: Clippy (boot-logic, host)
        run: |
          host="$(rustc -vV | sed -n 's/host: //p')"
          cargo clippy -p boot-logic --target "$host" --all-targets -- -D warnings

  host-tests:
    name: cargo test -p boot-logic (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Host test invocation (see .cargo/config.toml)
        run: |
          host="$(rustc -vV | sed -n 's/host: //p')"
          cargo test -p boot-logic --target "$host"

  firmware-build:
    name: cargo build --release (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (+ thumbv7em-none-eabihf)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build bootloader + demo-app + ra4m1-embassy
        run: cargo build --release --target thumbv7em-none-eabihf --workspace --exclude boot-logic

      - name: Locate llvm-objcopy / llvm-size (rust-toolchain.toml's llvm-tools component)
        id: llvm-tools
        run: |
          host="$(rustc -vV | sed -n 's/host: //p')"
          bindir="$(rustc --print sysroot)/lib/rustlib/$host/bin"
          echo "bindir=$bindir" >> "$GITHUB_OUTPUT"
          "$bindir/llvm-objcopy" --version
          "$bindir/llvm-size" --version

      - name: llvm-size (bootloader + demo-app)
        run: |
          bindir="${{ steps.llvm-tools.outputs.bindir }}"
          "$bindir/llvm-size" target/thumbv7em-none-eabihf/release/bootloader
          "$bindir/llvm-size" target/thumbv7em-none-eabihf/release/demo-app

      - name: Emit .bin/.hex (bootloader + demo-app)
        run: |
          bindir="${{ steps.llvm-tools.outputs.bindir }}"
          mkdir -p dist
          for bin in bootloader demo-app; do
            elf="target/thumbv7em-none-eabihf/release/$bin"
            cp "$elf" "dist/$bin.elf"
            "$bindir/llvm-objcopy" -O binary "$elf" "dist/$bin.bin"
            "$bindir/llvm-objcopy" -O ihex "$elf" "dist/$bin.hex"
          done
          ls -la dist

      - name: Size gate — bootloader.bin <= 32,768 B (docs/plan.md §1)
        run: |
          size="$(stat -c%s dist/bootloader.bin)"
          headroom=$(( SIZE_GATE_BYTES - size ))
          echo "bootloader.bin: $size B / $SIZE_GATE_BYTES B gate (headroom: $headroom B)"
          if [ "$size" -gt "$SIZE_GATE_BYTES" ]; then
            echo "::error::bootloader.bin ($size B) exceeds the $SIZE_GATE_BYTES B size gate by $(( -headroom )) B"
            exit 1
          fi

      - name: OFS byte-check — flash 0x400..0x43F (bootloader/src/ofs.rs, brick risk)
        run: |
          actual="$(xxd -s 1024 -l 64 -p dist/bootloader.bin | tr -d '\n')"
          expected="$(echo "$EXPECTED_OFS_HEX" | tr -d ' \n')"
          echo "expected: $expected"
          echo "actual:   $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::OFS bytes at flash 0x400..0x43F do not match the stock dump — this risks bricking the board (SPEC §1.5). See bootloader/src/ofs.rs."
            exit 1
          fi
          echo "OFS bytes 0x400..0x43F match the stock dump."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  renode:
    name: Renode emulation (robot suites)
    # Gate behind firmware-build so a broken build / size / OFS gate fails fast
    # before we spend a Renode run. renode/TODO.md "Infra"; docs/plan-m2.5-renode.md §4.
    needs: firmware-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (+ thumbv7em-none-eabihf)
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      # The robot suites LoadELF from target/.../release/ (repo-root-relative),
      # not from firmware-build's dist/*.elf artifacts — and they load the
      # ra4m1-hal *examples*, which firmware-build neither builds nor uploads.
      # So rebuild here (rust-cache keeps it cheap). See renode/smoke.robot.
      - name: Build firmware ELFs (bootloader + demo-app)
        run: cargo build --release --target thumbv7em-none-eabihf --workspace --exclude boot-logic
      - name: Build ra4m1-hal example ELFs (loaded by the robot suites)
        run: cargo build --release --target thumbv7em-none-eabihf -p ra4m1-hal --examples

      # Discover and run ALL renode/*.robot suites (smoke today; analog/serial/
      # bootloader added in parallel). The host shell expands the glob to files
      # that exist, so absent suites are simply skipped. Run from the repo root
      # (paths in the suites are repo-root-relative). Pin Renode to v1.16.1 —
      # the harness is written against it. --user root avoids a bind-mount write
      # mismatch on the runner-owned workspace; the runner is ephemeral.
      - name: Run Renode robot suites (pinned antmicro/renode:1.16.1)
        timeout-minutes: 15
        run: |
          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            antmicro/renode:1.16.1 \
            renode-test --results-dir renode-results renode/*.robot

      - name: Upload Renode test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renode-results-${{ github.sha }}
          path: |
            renode-results/robot_output.xml
            renode-results/log.html
            renode-results/report.html
            renode-results/**/*.txt
          if-no-files-found: warn

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/embassy-ra4m1-v')
    needs: firmware-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # embassy-ra4m1-v0.1.0-alpha.2 -> version v0.1.0-alpha.2; any SemVer
      # pre-release suffix (-alpha/-beta/-rc) marks the release a pre-release.
      - name: Derive version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#embassy-ra4m1-}"
          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version=$version prerelease=$prerelease"
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Embassy RA4M1 bootloader ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: dist/*
          generate_release_notes: true
