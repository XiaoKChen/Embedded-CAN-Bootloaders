name: Build & Release Bootloader

on:
  push:
    branches: [version/c-cpp/ra4m1]
    tags: ["c-cpp-ra4m1-v*"]
  pull_request:
    branches: [version/c-cpp/ra4m1]
  workflow_dispatch:

permissions:
  contents: read

env:
  # xPack arm-none-eabi-gcc — must match docs/build.md (a different gcc
  # changes the image size and would move the 16,384-byte size-gate result).
  GCC_VERSION: 14.2.1-1.1
  BOARD: uno_r4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache xPack arm-none-eabi-gcc
        id: cache-gcc
        uses: actions/cache@v4
        with:
          path: ~/toolchain
          key: xpack-arm-none-eabi-gcc-${{ env.GCC_VERSION }}-linux-x64

      - name: Install xPack arm-none-eabi-gcc ${{ env.GCC_VERSION }}
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchain
          url="https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v${GCC_VERSION}/xpack-arm-none-eabi-gcc-${GCC_VERSION}-linux-x64.tar.gz"
          curl -fL "$url" | tar -xz -C ~/toolchain

      - name: Add toolchain to PATH
        run: ls -d ~/toolchain/xpack-arm-none-eabi-gcc-*/bin >> "$GITHUB_PATH"

      - name: Build bootloader (fetch deps + make + size gate)
        run: bash scripts/ci-build.sh

      - name: Collect & version-name artifacts
        id: collect
        run: |
          out="vendor/arduino-renesas-bootloader/_build/${BOARD}"
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            tag="${GITHUB_REF#refs/tags/}"          # e.g. c-cpp-ra4m1-v1.0.0
            version="${tag#c-cpp-ra4m1-}"          # e.g. v1.0.0
          else
            version="$(git rev-parse --short HEAD)"  # non-tag builds
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          for ext in hex bin elf; do
            cp "$out/arduino-renesas-bootloader.$ext" \
               "dist/bootloader-${BOARD}-${version}.$ext"
          done
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bootloader-${{ env.BOARD }}-${{ steps.collect.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    # Only publish a release when a c-cpp-ra4m1-v* tag is pushed.
    if: startsWith(github.ref, 'refs/tags/c-cpp-ra4m1-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # GITHUB_TOKEN needs write to create the release
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
